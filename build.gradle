plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = '1.0.0'
group = 'com.example.militarymod'
base { archivesName = 'militarymod' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { militarymod { source sourceSets.main } }
        }
        client { property 'forge.enabledGameTestNamespaces', 'militarymod' }
        server { property 'forge.enabledGameTestNamespaces', 'militarymod'; args '--nogui' }
    }
}

repositories {
    maven {
        name = 'Curse Maven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    // TACZ solo per compilare (a runtime lo fornisce il modpack). Facoltativo: se manca, il mod usa il fucile base.
    compileOnly fg.deobf('curse.maven:timeless-and-classics-zero-1028108:6632240')
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [mod_version: version]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) { expand replaceProperties }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
}
